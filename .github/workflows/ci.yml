name: CI

on:
  push:
    branches: [main, scratch]
  pull_request:
    branches: [main, scratch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'

      - name: Run tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Check release version policy
        run: bash scripts/qa_release_version.sh

      - name: Check shell scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          curl -fsSL -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz' | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          /tmp/shellcheck-v0.11.0/shellcheck scripts/*.sh

      - name: Build (smoke test)
        run: |
          go build -o cardbot .
          expected="$(< VERSION)"
          test "$(./cardbot --version)" = "cardbot $expected"
          make build
          ./cardbot --version | grep -F "cardbot $expected (commit:"
          make build VERSION="${expected%-dev}"
          ./cardbot --version | grep -F "cardbot ${expected%-dev} (commit:"

  release-targets:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
      - name: Cross-build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build ./...

  artifact-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Create tiny artifact fixture
        run: printf 'cardbot artifact QA\n' > cardbot-qa.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cardbot-artifact-qa
          path: cardbot-qa.txt
          retention-days: 1
          if-no-files-found: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cardbot-artifact-qa
          path: artifact-result
          merge-multiple: true
      - name: Verify artifact round trip
        run: cmp cardbot-qa.txt artifact-result/cardbot-qa.txt

  native-macos-detector:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
      - name: Build and test opt-in native detector
        run: go test -tags cardbot_native ./detect
